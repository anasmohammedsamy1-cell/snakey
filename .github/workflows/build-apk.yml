name: Build Godot Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          java -version
          keytool -help >/dev/null

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Install Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -O templates.tpz

          unzip -q templates.tpz -d templates

          cp -r \
            templates/templates/* \
            ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Verify Godot
        run: |
          godot --version
          test -f project.godot
          test -f export_presets.cfg

      - name: Verify Android preset
        run: |
          grep -q 'name="snake"' export_presets.cfg

      - name: Generate release keystore
        run: |
          keytool \
            -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/snakearena-release.keystore" \
            -alias snakearena \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=SnakeArena,O=SnakeArena,C=US"

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/snakearena-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: snakearena
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-release "snake" \
            build/snakearena.apk

      - name: Verify APK
        run: |
          test -f build/snakearena.apk
          ls -lh build/snakearena.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SnakeArena-Android-APK
          path: build/snakearena.apk
          if-no-files-found: error
