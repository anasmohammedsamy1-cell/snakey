
name: Android APK Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Download project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;35" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      # 4. Install Godot and matching export templates
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      # 5. Verify environment
      - name: Verify tools
        run: |
          godot --version
          java -version
          echo "Android SDK: $ANDROID_HOME"

      # 6. Generate temporary debug keystore
      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/android-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/android-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      # 7. Import project resources
      - name: Import Godot project
        run: |
          godot --headless --editor --path . --import

      # 8. Export APK
      - name: Export Android APK
        run: |
          mkdir -p export

          godot --headless \
            --path . \
            --export-debug "Android" \
            export/LastOneFalls.apk

      # 9. Verify APK architectures
      - name: Verify APK
        run: |
          set -euo pipefail

          APK="export/LastOneFalls.apk"

          test -f "$APK"

          unzip -Z1 "$APK" > apk_contents.txt

          grep -q "lib/armeabi-v7a/" apk_contents.txt
          grep -q "lib/arm64-v8a/" apk_contents.txt

          echo "APK successfully contains both ARM architectures!"

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LastOneFalls-Android-APK
          path: export/LastOneFalls.apk
          if-no-files-found: error
          retention-days: 14
